<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body>
   <!-- navbar: barra de navegação -->
  <!-- navbar-expand-lg: em telas grandes (lg) a navbar fica expandida; em telas menores, colapsa -->
  <!-- navbar-dark bg-dark: texto claro sobre fundo escuro -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <!-- container: centraliza o conteúdo da navbar -->
    <div class="container">

      <!-- navbar-brand: o "logo" ou nome da aplicação à esquerda -->
      <a class="navbar-brand" href="/">Calculadora de Carbono</a>

      <!-- navbar-toggler: o botão hamburguer que aparece em telas pequenas -->
      <!-- data-bs-toggle e data-bs-target: conectam o botão ao menu colapsável -->
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- collapse navbar-collapse: o conjunto de links que colapsa em telas pequenas -->
      <!-- id="navbarNav": deve bater com o data-bs-target do botão acima -->
      <div class="collapse navbar-collapse" id="navbarNav">

        <!-- navbar-nav ms-auto: lista de links, ms-auto empurra para a direita -->
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <!-- nav-link active: link ativo (página atual) fica destacado -->
            <a class="nav-link active" href="/">Início</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/sobre">Sobre</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/calcular">Calcular</a>
          </li>
        </ul>

      </div>
    </div>
  </nav>

  <!-- Conteúdo principal da página -->
   <div class="container mt-5">
  <form class="row g-3" method="POST" action="/calcular/">
  <div class="col-md-6">
    <label for="distancia" class="form-label">Distância percorrida por dia (km, somando ida e volta)</label>
    <input type="number" class="form-control" name="distancia" id="distancia" placeholder="Digite a distância em km">
  </div>
  <div class="col-md-6">
    <label for="dias" class="form-label">Dias de deslocamento por semana</label>
    <input type="number" class="form-control" name="dias" id="dias" placeholder="Digite a quantidade de dias">
  </div>
  <div class="col-md-4">
    <label for="inputtransporte" class="form-label">Meio de transporte</label>
    <select name="transporte" id="inputtransporte" class="form-select">
      <option selected>Selecione</option>
      <option>Bicicleta e a pé</option>
      <option>Carro elétrico</option>
      <option>Ônibus (por passageiro)</option>
      <option>Moto</option>
      <option>Carro a gasolina</option>
    </select>
  </div>
  <div class="col-12">
    <button type="submit" class="btn btn-primary">Calcular</button>
  </div>
</form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
  </script>
</body>
</html>
